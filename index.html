<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    
</head>
<body>
    <div class="attempts">
        <h2>Attempts left</h2>
        <div class="attempt-count" aria-live="polite"></div>
    </div>
    <div class="tiles"></div>
    <p class="game-status" role="status"></p>
    <button class="reset-btn">Reset game</button>
    <div class="difficulty">
        <h2>Choose difficulty:</h2>
        <button id="easy-btn" data-level="easy">Easy</button>
        <button id="medium-btn" data-level="medium">Medium</button>
        <button id="hard-btn" data-level="hard">Hard</button>

    </div>
</body>
</html>
